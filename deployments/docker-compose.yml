name: seed-project-devops

services:
  # [DANIEL] Layanan 1: Database PostgreSQL. Menggunakan volume persisten.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # [DANIEL] Mengecek apakah Postgres benar-benar siap menerima koneksi (pg_isready).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  # [DANIEL] Layanan 2: Redis sebagai message broker untuk antrean (Queue) BullMQ.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      # [DANIEL] Mengecek apakah Redis membalas 'PONG' (berarti siap).
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  # [DANIEL] Layanan 3: REST API (Express). Ini yang diekspos ke publik (port 3000).
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        # [DANIEL] Mencegah Race Condition: API tidak akan jalan sebelum Postgres healthy.
        condition: service_healthy
      redis:
        # [DANIEL] API tidak akan jalan sebelum Redis healthy.
        condition: service_healthy
    networks:
      - app-network

  # [DANIEL] Layanan 4: Worker BullMQ. Berjalan di background tanpa expose port.
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # [DANIEL] Layanan 5: Frontend (Nginx). Bertindak sebagai reverse proxy ke API.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - app-network

  # [DANIEL] Service tambahan untuk menjalankan Vitest (hanya jalan jika dipanggil profil 'test').
  backend-test:
    profiles: ["test"]
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: test
    command: ["npm", "test"]
    env_file:
      - .env
    environment:
      NODE_ENV: test
    networks:
      - app-network

volumes:
  # [DANIEL] Named volume untuk persistensi data PostgreSQL. 
  # Data tidak hilang saat container mati, kecuali dihapus dengan 'down -v'.
  pgdata:
    driver: local

networks:
  # [DANIEL] Bridge network agar semua container bisa saling komunikasi via nama service-nya.
  app-network:
    driver: bridge