server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # [YOSUA] SPA Fallback: Jika user me-refresh di route selain '/', 
    # Nginx akan mengarahkannya ke index.html agar router di frontend yang menangani.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # [YOSUA] Reverse Proxy API: Meneruskan request /api/ dari browser 
    # menuju container 'api' port 3000. Ini menghindari masalah CORS.
    # PERHATIAN: /api/ di belakang port 3000 wajib ada agar path tidak terpotong.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # [YOSUA] Reverse Proxy Healthcheck: Meneruskan request pengecekan status ke backend.
    location /healthz/ {
        proxy_pass http://api:3000/healthz/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
    }
}